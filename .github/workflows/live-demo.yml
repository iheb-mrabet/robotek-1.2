name: Robotek Live Demo
run-name: Robotek Live Demo · ${{ github.event.pull_request.title || github.event.head_commit.message || 'Manual validation' }}

on:
  pull_request:
    branches:
      - main
    paths:
      - demo/**
      - deploy/helm/robotek-demo/**
      - deploy/helm/observability/**
      - .github/workflows/live-demo.yml

  push:
    branches:
      - main
    paths:
      - demo/**
      - deploy/helm/robotek-demo/**
      - deploy/helm/observability/**
      - .github/workflows/live-demo.yml

  workflow_dispatch:

concurrency:
  group: robotek-live-demo-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: ihebmrabet
  VALUES_FILE: deploy/helm/robotek-demo/values-staging.yaml

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: demo/backend/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r demo/backend/requirements-dev.txt

      - name: Run backend unit tests
        working-directory: demo/backend
        run: |
          mkdir -p reports
          python -m pytest tests/test_app.py \
            --junitxml=reports/unit-tests.xml

      - name: Upload unit-test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: robotek-demo-unit-tests
          path: demo/backend/reports/unit-tests.xml

  integration-tests:
    name: Frontend + backend + database integration
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install integration test runner
        run: python -m pip install pytest==8.4.1

      - name: Build and start all three containers
        run: docker compose -f demo/compose.yaml up --build --detach --wait

      - name: Run full-stack integration tests
        env:
          DEMO_BASE_URL: http://127.0.0.1:8080
        run: |
          mkdir -p reports
          python -m pytest demo/backend/tests/test_integration.py \
            --junitxml=reports/integration-tests.xml

      - name: Display container orchestration
        if: always()
        run: docker compose -f demo/compose.yaml ps

      - name: Display container logs on failure
        if: failure()
        run: docker compose -f demo/compose.yaml logs --no-color

      - name: Stop integration environment
        if: always()
        run: docker compose -f demo/compose.yaml down --volumes

      - name: Upload integration-test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: robotek-demo-integration-tests
          path: reports/integration-tests.xml

  orchestration:
    name: Helm and orchestration validation
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.21.1

      - name: Validate Docker Compose orchestration
        run: docker compose -f demo/compose.yaml config --quiet

      - name: Lint Kubernetes Helm chart
        run: helm lint deploy/helm/robotek-demo --values deploy/helm/robotek-demo/values-staging.yaml

      - name: Build and lint observability Helm chart
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm dependency build deploy/helm/observability
          helm lint deploy/helm/observability \
            --values deploy/helm/observability/values-staging.yaml

      - name: Render Kubernetes deployment
        run: |
          helm template robotek-demo deploy/helm/robotek-demo \
            --namespace robotek-demo \
            --values deploy/helm/robotek-demo/values-staging.yaml \
            > /tmp/robotek-demo.yaml
          grep -E '^kind: (Deployment|Service|Secret|Role|RoleBinding)$' /tmp/robotek-demo.yaml

          helm template robotek-observability deploy/helm/observability \
            --namespace monitoring \
            --values deploy/helm/observability/values-staging.yaml \
            > /tmp/robotek-observability.yaml
          grep -F 'name: robotek-grafana' /tmp/robotek-observability.yaml
          grep -F 'value: "http://robotek-grafana.monitoring.svc.cluster.local"' \
            /tmp/robotek-demo.yaml

  build-and-push:
    name: Build and push ${{ matrix.component }} image
    if: github.event_name != 'pull_request'
    needs:
      - unit-tests
      - integration-tests
      - orchestration
    strategy:
      fail-fast: false
      matrix:
        component:
          - frontend
          - backend
          - database
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push immutable and latest tags
        uses: docker/build-push-action@v7
        with:
          context: demo/${{ matrix.component }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/robotek-demo-${{ matrix.component }}:${{ github.sha }}
            ${{ env.DOCKERHUB_NAMESPACE }}/robotek-demo-${{ matrix.component }}:latest
          cache-from: type=gha,scope=robotek-demo-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=robotek-demo-${{ matrix.component }}

      - name: Scan published image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKERHUB_NAMESPACE }}/robotek-demo-${{ matrix.component }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  promote-gitops:
    name: Promote images through GitOps
    needs: build-and-push
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      promotion_sha: ${{ steps.commit.outputs.promotion_sha }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Update all three image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("deploy/helm/robotek-demo/values-staging.yaml")
          tag = os.environ["IMAGE_TAG"]
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(r"(?m)^(\s+tag:)\s*.*$", rf"\1 {tag}", text)
          if count != 3:
              raise SystemExit(f"Expected three image tags, found {count}")
          path.write_text(updated, encoding="utf-8")
          PY
          grep -n 'tag:' "${VALUES_FILE}"

      - name: Commit GitOps promotion
        id: commit
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${VALUES_FILE}"
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "chore(demo): promote live images ${IMAGE_TAG}"
            git push origin HEAD:main
          fi
          echo "promotion_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  automated-deployment:
    name: Argo CD automated deployment
    needs: promote-gitops
    runs-on:
      - self-hosted
      - linux
      - x64
      - robotek-staging
      - k3s
      - staging
    timeout-minutes: 10
    steps:
      - name: Wait for Argo CD synchronization
        env:
          EXPECTED_REVISION: ${{ needs.promote-gitops.outputs.promotion_sha }}
        run: |
          for attempt in $(seq 1 60); do
            revision="$(kubectl -n argocd get application robotek-demo -o jsonpath='{.status.sync.revision}' 2>/dev/null || true)"
            sync="$(kubectl -n argocd get application robotek-demo -o jsonpath='{.status.sync.status}' 2>/dev/null || true)"
            health="$(kubectl -n argocd get application robotek-demo -o jsonpath='{.status.health.status}' 2>/dev/null || true)"
            echo "Attempt ${attempt}: revision=${revision} sync=${sync} health=${health}"
            if [[ "${revision}" == "${EXPECTED_REVISION}" && "${sync}" == "Synced" && "${health}" == "Healthy" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Argo CD did not reach the expected healthy revision." >&2
          exit 1

      - name: Verify all Kubernetes deployments
        run: |
          kubectl -n robotek-demo rollout status deployment/robotek-demo-database --timeout=120s
          kubectl -n robotek-demo rollout status deployment/robotek-demo-backend --timeout=120s
          kubectl -n robotek-demo rollout status deployment/robotek-demo-frontend --timeout=120s
          kubectl -n robotek-demo get pods,services

      - name: Verify live webpage and API
        env:
          EXPECTED_IMAGE_TAG: ${{ github.sha }}
        run: |
          curl --fail --show-error --silent \
            --retry 12 --retry-all-errors --retry-delay 5 --retry-max-time 90 \
            http://127.0.0.1:30080/ \
            | grep -F "Robotek Delivery Robot"

          curl --fail --show-error --silent \
            --retry 12 --retry-all-errors --retry-delay 5 --retry-max-time 90 \
            http://127.0.0.1:30080/health \
            | grep -F '"status":"ok"'

          curl --fail --show-error --silent \
            --retry 12 --retry-all-errors --retry-delay 5 --retry-max-time 90 \
            http://127.0.0.1:30080/ready \
            | grep -F '"status":"ready"'

          telemetry_valid=false
          for attempt in $(seq 1 18); do
            echo "Live telemetry validation attempt ${attempt}"
            if curl --fail --show-error --silent \
              http://127.0.0.1:30080/api/platform \
              > /tmp/robotek-platform.json \
              && python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/robotek-platform.json").read_text(encoding="utf-8")
          )

          robot = payload["robot"]
          cluster = payload["cluster"]
          observability = payload["observability"]

          def require(condition, message):
              if not condition:
                  raise AssertionError(message)

          require(payload["data_policy"] == "live-only", "data policy is not live-only")
          require(
              payload["release"] == os.environ["EXPECTED_IMAGE_TAG"],
              "deployed release does not match the workflow commit",
          )
          require(payload["database"]["connected"] is True, "PostgreSQL is unavailable")

          require(observability["prometheus_reachable"] is True, "Prometheus is unavailable")
          require(observability["targets_total"] > 0, "Prometheus has no targets")
          require(
              observability["targets_up"] == observability["targets_total"],
              "one or more Prometheus targets are down",
          )
          require(observability["gitops_total"] > 0, "Argo CD metrics are unavailable")
          require(
              observability["gitops_synced"] == observability["gitops_total"],
              "one or more Argo CD applications are out of sync",
          )
          require(
              observability["gitops_healthy"] == observability["gitops_total"],
              "one or more Argo CD applications are unhealthy",
          )
          require(
              observability["prometheus_uptime_seconds"] > 0,
              "Prometheus uptime is unavailable",
          )
          require(observability["grafana"]["reachable"] is True, "Grafana is unavailable")
          require(observability["grafana"]["database"] == "ok", "Grafana database is unhealthy")
          require(observability["grafana"]["version"], "Grafana version is unavailable")

          require(robot["exporter_up"] is True, "ROS exporter is down")
          require(robot["nodes"] > 0, "live ROS nodes are unavailable")
          require(robot["topics"] > 0, "live ROS topics are unavailable")
          require(robot["collection_errors"] == 0, "ROS collection reports errors")
          require(robot["runtime_uptime_seconds"] > 0, "robot runtime uptime is unavailable")
          require(robot["container_restarts"] >= 0, "robot restart count is unavailable")

          require(cluster["nodes_ready"] == cluster["nodes_total"], "a K3s node is not ready")
          require(cluster["pods_ready"] == cluster["pods_total"], "a Robotek pod is not ready")
          require(
              cluster["deployments_available"] == cluster["deployments_desired"],
              "a Robotek deployment is unavailable",
          )
          require(0 <= cluster["cpu_percent"] <= 100, "cluster CPU is unavailable")
          require(0 <= cluster["memory_percent"] <= 100, "cluster memory is unavailable")
          require(cluster["uptime_seconds"] > 0, "K3s uptime is unavailable")
          PY
            then
              telemetry_valid=true
              break
            fi
            sleep 5
          done

          if [[ "${telemetry_valid}" != true ]]; then
            echo "Live telemetry did not satisfy the deployment contract:" >&2
            python3 -m json.tool /tmp/robotek-platform.json >&2
            exit 1
          fi
          python3 -m json.tool /tmp/robotek-platform.json

      - name: Deployment summary
        run: |
          {
            echo "## Robotek live deployment"
            echo
            echo "- Unit tests: passed"
            echo "- Integration tests: passed"
            echo "- Frontend image: Docker Hub"
            echo "- Backend image: Docker Hub"
            echo "- Database image: Docker Hub"
            echo "- Helm rendering: passed"
            echo "- Argo CD synchronization: healthy"
            echo "- Live interface: reachable"
            echo "- ROS and cluster telemetry: Prometheus-backed"
            echo "- Data policy: live-only; unavailable sources are never simulated"
          } >> "${GITHUB_STEP_SUMMARY}"

  public-interface:
    name: Publish temporary HTTPS interface
    needs: automated-deployment
    runs-on:
      - self-hosted
      - linux
      - x64
      - robotek-staging
      - k3s
      - staging
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Start or reuse Cloudflare Quick Tunnel
        id: tunnel
        env:
          CLOUDFLARED_VERSION: 2026.8.2
          CLOUDFLARED_SHA256: fcfb02b575a52ca1af2e3267af4e1517bcdeb30ac48c834c69abaed3c0576ad2
        run: |
          set -Eeuo pipefail

          tunnel_dir="/tmp/robotek-live-demo-tunnel"
          binary="${tunnel_dir}/cloudflared"
          pid_file="${tunnel_dir}/cloudflared.pid"
          url_file="${tunnel_dir}/public-url"
          log_file="${tunnel_dir}/cloudflared.log"
          mkdir -p "${tunnel_dir}"

          if [[ ! -x "${binary}" ]] || ! echo "${CLOUDFLARED_SHA256}  ${binary}" | sha256sum --check --status; then
            curl --fail --location --silent --show-error \
              --retry 5 --retry-all-errors \
              "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" \
              --output "${binary}.download"
            echo "${CLOUDFLARED_SHA256}  ${binary}.download" | sha256sum --check
            chmod 0755 "${binary}.download"
            mv "${binary}.download" "${binary}"
          fi

          tunnel_process_is_valid() {
            local pid="$1"
            [[ "${pid}" =~ ^[0-9]+$ ]] || return 1
            kill -0 "${pid}" 2>/dev/null || return 1
            tr '\0' ' ' < "/proc/${pid}/cmdline" | grep --fixed-strings --quiet "${binary} tunnel"
          }

          public_url=""
          existing_pid=""
          if [[ -s "${pid_file}" ]]; then
            existing_pid="$(<"${pid_file}")"
          fi

          if tunnel_process_is_valid "${existing_pid}" && [[ -s "${url_file}" ]]; then
            candidate_url="$(<"${url_file}")"
            if curl --fail --silent --show-error --max-time 15 \
              "${candidate_url}/health" | grep --fixed-strings --quiet '"status":"ok"'; then
              public_url="${candidate_url}"
              echo "Reusing healthy tunnel ${public_url}"
            fi
          fi

          if [[ -z "${public_url}" ]]; then
            if tunnel_process_is_valid "${existing_pid}"; then
              kill "${existing_pid}"
              for _ in $(seq 1 20); do
                kill -0 "${existing_pid}" 2>/dev/null || break
                sleep 0.25
              done
            fi

            : > "${log_file}"
            nohup env RUNNER_TRACKING_ID=robotek-public-tunnel \
              "${binary}" tunnel \
              --no-autoupdate \
              --protocol http2 \
              --url http://127.0.0.1:30080 \
              > "${log_file}" 2>&1 < /dev/null &
            tunnel_pid=$!
            echo "${tunnel_pid}" > "${pid_file}"

            for _ in $(seq 1 60); do
              public_url="$(grep --extended-regexp --only-matching \
                'https://[-a-z0-9]+\.trycloudflare\.com' \
                "${log_file}" | tail -n 1 || true)"
              if [[ -n "${public_url}" ]] && curl --fail --silent --show-error \
                --max-time 15 "${public_url}/health" \
                | grep --fixed-strings --quiet '"status":"ok"'; then
                echo "${public_url}" > "${url_file}"
                break
              fi
              public_url=""
              sleep 2
            done
          fi

          if [[ -z "${public_url}" ]]; then
            echo "Cloudflare tunnel did not become healthy." >&2
            tail -n 80 "${log_file}" >&2
            exit 1
          fi

          curl --fail --silent --show-error --max-time 15 "${public_url}/" \
            | grep --fixed-strings --quiet "Robotek Delivery Robot"

          echo "public_url=${public_url}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Public Robotek interface"
            echo
            echo "- HTTPS dashboard: ${public_url}"
            echo "- Health endpoint: ${public_url}/health"
            echo "- Source: AWS K3s NodePort through Cloudflare Quick Tunnel"
            echo "- Status: externally reachable and verified"
          } >> "${GITHUB_STEP_SUMMARY}"
