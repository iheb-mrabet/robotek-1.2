name: Robotek Live Demo
run-name: Robotek Live Demo · ${{ github.event.head_commit.message }}

on:
  push:
    branches:
      - main
    paths:
      - demo/**
      - .github/workflows/live-demo.yml

  workflow_dispatch:

concurrency:
  group: robotek-live-demo
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: ihebmrabet
  VALUES_FILE: deploy/helm/robotek-demo/values-staging.yaml

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: demo/backend/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r demo/backend/requirements-dev.txt

      - name: Run backend unit tests
        working-directory: demo/backend
        run: |
          mkdir -p reports
          python -m pytest tests/test_app.py \
            --junitxml=reports/unit-tests.xml

      - name: Upload unit-test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: robotek-demo-unit-tests
          path: demo/backend/reports/unit-tests.xml

  integration-tests:
    name: Frontend + backend + database integration
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install integration test runner
        run: python -m pip install pytest==8.4.1

      - name: Build and start all three containers
        run: docker compose -f demo/compose.yaml up --build --detach --wait

      - name: Run full-stack integration tests
        env:
          DEMO_BASE_URL: http://127.0.0.1:8080
        run: |
          mkdir -p reports
          python -m pytest demo/backend/tests/test_integration.py \
            --junitxml=reports/integration-tests.xml

      - name: Display container orchestration
        if: always()
        run: docker compose -f demo/compose.yaml ps

      - name: Display container logs on failure
        if: failure()
        run: docker compose -f demo/compose.yaml logs --no-color

      - name: Stop integration environment
        if: always()
        run: docker compose -f demo/compose.yaml down --volumes

      - name: Upload integration-test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: robotek-demo-integration-tests
          path: reports/integration-tests.xml

  orchestration:
    name: Helm and orchestration validation
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.21.1

      - name: Validate Docker Compose orchestration
        run: docker compose -f demo/compose.yaml config --quiet

      - name: Lint Kubernetes Helm chart
        run: helm lint deploy/helm/robotek-demo --values deploy/helm/robotek-demo/values-staging.yaml

      - name: Render Kubernetes deployment
        run: |
          helm template robotek-demo deploy/helm/robotek-demo \
            --namespace robotek-demo \
            --values deploy/helm/robotek-demo/values-staging.yaml \
            > /tmp/robotek-demo.yaml
          grep -E '^kind: (Deployment|Service|Secret)$' /tmp/robotek-demo.yaml

  build-and-push:
    name: Build and push ${{ matrix.component }} image
    needs:
      - unit-tests
      - integration-tests
      - orchestration
    strategy:
      fail-fast: false
      matrix:
        component:
          - frontend
          - backend
          - database
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push immutable and latest tags
        uses: docker/build-push-action@v7
        with:
          context: demo/${{ matrix.component }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/robotek-demo-${{ matrix.component }}:${{ github.sha }}
            ${{ env.DOCKERHUB_NAMESPACE }}/robotek-demo-${{ matrix.component }}:latest
          cache-from: type=gha,scope=robotek-demo-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=robotek-demo-${{ matrix.component }}

      - name: Scan published image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.DOCKERHUB_NAMESPACE }}/robotek-demo-${{ matrix.component }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  promote-gitops:
    name: Promote images through GitOps
    needs: build-and-push
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      promotion_sha: ${{ steps.commit.outputs.promotion_sha }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Update all three image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("deploy/helm/robotek-demo/values-staging.yaml")
          tag = os.environ["IMAGE_TAG"]
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(r"(?m)^(\s+tag:)\s*.*$", rf"\1 {tag}", text)
          if count != 3:
              raise SystemExit(f"Expected three image tags, found {count}")
          path.write_text(updated, encoding="utf-8")
          PY
          grep -n 'tag:' "${VALUES_FILE}"

      - name: Commit GitOps promotion
        id: commit
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${VALUES_FILE}"
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "chore(demo): promote live images ${IMAGE_TAG}"
            git push origin HEAD:main
          fi
          echo "promotion_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  automated-deployment:
    name: Argo CD automated deployment
    needs: promote-gitops
    runs-on:
      - self-hosted
      - linux
      - x64
      - robotek-staging
      - k3s
      - staging
    timeout-minutes: 10
    steps:
      - name: Wait for Argo CD synchronization
        env:
          EXPECTED_REVISION: ${{ needs.promote-gitops.outputs.promotion_sha }}
        run: |
          for attempt in $(seq 1 60); do
            revision="$(kubectl -n argocd get application robotek-demo -o jsonpath='{.status.sync.revision}' 2>/dev/null || true)"
            sync="$(kubectl -n argocd get application robotek-demo -o jsonpath='{.status.sync.status}' 2>/dev/null || true)"
            health="$(kubectl -n argocd get application robotek-demo -o jsonpath='{.status.health.status}' 2>/dev/null || true)"
            echo "Attempt ${attempt}: revision=${revision} sync=${sync} health=${health}"
            if [[ "${revision}" == "${EXPECTED_REVISION}" && "${sync}" == "Synced" && "${health}" == "Healthy" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Argo CD did not reach the expected healthy revision." >&2
          exit 1

      - name: Verify all Kubernetes deployments
        run: |
          kubectl -n robotek-demo rollout status deployment/robotek-demo-database --timeout=120s
          kubectl -n robotek-demo rollout status deployment/robotek-demo-backend --timeout=120s
          kubectl -n robotek-demo rollout status deployment/robotek-demo-frontend --timeout=120s
          kubectl -n robotek-demo get pods,services

      - name: Verify live webpage and API
        run: |
          curl --fail --show-error --silent http://127.0.0.1:30080/ | grep -F "Robotek Delivery Robot"
          curl --fail --show-error --silent http://127.0.0.1:30080/health
          curl --fail --show-error --silent http://127.0.0.1:30080/api/robot

      - name: Deployment summary
        run: |
          {
            echo "## Robotek live deployment"
            echo
            echo "- Unit tests: passed"
            echo "- Integration tests: passed"
            echo "- Frontend image: Docker Hub"
            echo "- Backend image: Docker Hub"
            echo "- Database image: Docker Hub"
            echo "- Helm rendering: passed"
            echo "- Argo CD synchronization: healthy"
            echo "- Live interface: reachable"
          } >> "${GITHUB_STEP_SUMMARY}"
