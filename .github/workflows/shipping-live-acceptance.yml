name: Robotek Shipping Live Acceptance
on:
  push:
    branches: [audit/shipping-live-acceptance-20261002]
    paths: [.github/workflows/shipping-live-acceptance.yml]
permissions:
  contents: read
concurrency:
  group: robotek-shipping-live-acceptance
  cancel-in-progress: false
jobs:
  acceptance:
    name: Final AWS shipping acceptance
    runs-on: [self-hosted, linux, x64, robotek-staging, k3s, staging]
    timeout-minutes: 15
    env:
      EXPECTED_DIGEST: sha256:068bfb5d296a4e4a548415f04432713b8aa8ff308be03a7d5fdeed0064acd2a2
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify all four applications track main and are healthy
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 60); do
            ready=true
            for app in robotek-staging robotek-demo robotek-observability robotek-runtime-security; do
              state=$(kubectl -n argocd get application "$app" \
                -o jsonpath='{.spec.source.targetRevision} {.status.sync.status} {.status.health.status}' 2>/dev/null)
              if test "$state" != 'main Synced Healthy'; then ready=false; fi
            done
            if test "$ready" = true; then
              echo 'PASS all four GitOps applications'
              exit 0
            fi
            sleep 5
          done
          echo 'FAIL all four GitOps applications did not become healthy'
          exit 1
      - name: Verify stable complete revision and exact deployed runtime digest
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3; do
            if bash scripts/deployment/verify_release.sh >/dev/null 2>&1; then
              echo "PASS stable exact runtime verification attempt $attempt"
            else
              echo "FAIL stable runtime verification attempt $attempt"
              exit 1
            fi
          done
      - name: Repeat live ROS publication checks three times
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3; do
            if timeout 110 bash scripts/deployment/smoke_test.sh >/dev/null 2>&1; then
              echo "PASS live ROS smoke attempt $attempt"
            else
              echo "FAIL live ROS smoke attempt $attempt"
              exit 1
            fi
          done
      - name: Verify public HTTPS and complete platform contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tests/acceptance/public_platform.py
      - name: Verify delivery cancellation emergency stop and recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          pod=$(kubectl -n robotek-staging get pods \
            -l app.kubernetes.io/instance=robotek-staging --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          if timeout 300 kubectl -n robotek-staging exec -i -c robotek "$pod" -- \
            bash -lc 'source /opt/ros/${ROS_DISTRO}/setup.bash; source /opt/robot/setup.bash; exec python3 -u -' \
            < tests/acceptance/live_runtime_acceptance.py 2>/dev/null | \
            awk '/^ROBOTEK_ACCEPTANCE_FAILURE stage=/{print}'; then
            echo 'PASS delivery cancellation emergency stop recovery and input rejection'
          else
            echo 'FAIL deployed robot behavior'
            exit 1
          fi
      - name: Verify fresh Falco detection
        shell: bash
        run: |
          set -Eeuo pipefail
          if timeout 200 python3 tests/acceptance/falco_detection.py >/dev/null 2>&1; then
            echo 'PASS fresh Falco terminal-shell detection'
          else
            echo 'FAIL fresh Falco detection'
            exit 1
          fi
      - name: Recheck platform health after the robot exercise
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tests/acceptance/public_platform.py
