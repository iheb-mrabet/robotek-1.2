name: Robotek Shipping Live Acceptance
on:
  push:
    branches: [audit/shipping-live-acceptance-20261002]
    paths: [.github/workflows/shipping-live-acceptance.yml]
permissions:
  contents: read
concurrency:
  group: robotek-shipping-live-acceptance
  cancel-in-progress: false
jobs:
  diagnostics:
    name: Boolean ROS discovery and Falco availability checks
    runs-on: [self-hosted, linux, x64, robotek-staging, k3s, staging]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check direct discovery of required public ROS interfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          pod=$(kubectl -n robotek-staging get pods \
            -l app.kubernetes.io/instance=robotek-staging --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          if kubectl -n robotek-staging exec -c robotek "$pod" -- bash -lc '
            source /opt/ros/${ROS_DISTRO}/setup.bash
            source /opt/robot/setup.bash
            topics=$(timeout 20 ros2 topic list --no-daemon --spin-time 5)
            for expected in /clock /cmd_vel /mission/status /odom /scan /tf; do
              grep -Fxq "$expected" <<< "$topics" || exit 1
            done
          ' >/dev/null 2>&1; then
            echo 'PASS direct ROS discovery'
          else
            echo 'FAIL direct ROS discovery'
            exit 1
          fi
      - name: Check Falco metrics availability
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          pod=$(kubectl -n robotek-staging get pods \
            -l app.kubernetes.io/instance=robotek-staging --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          if timeout 60 kubectl -n robotek-staging exec -i -c robotek "$pod" -- python3 - \
            < tests/acceptance/falco_probe.py >/dev/null 2>&1; then
            echo 'PASS Falco metrics availability'
          else
            echo 'FAIL Falco metrics availability'
            exit 1
          fi
