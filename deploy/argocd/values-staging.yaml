# Metrics Services exist from bootstrap; ServiceMonitors are owned by the
# observability chart, after its Prometheus Operator CRDs are installed.
configs:
  cm:
    url: ""

dex:
  enabled: false

controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

server:
  service:
    type: ClusterIP

  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

repoServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

applicationSet:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

notifications:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
