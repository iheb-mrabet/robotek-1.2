apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: robotek-observability
  namespace: argocd

  annotations:
    # Compare the API server's normalized object so Kubernetes defaults on the
    # Grafana StatefulSet do not create a permanent false OutOfSync result.
    argocd.argoproj.io/compare-options: ServerSideDiff=true

  labels:
    app.kubernetes.io/name: robotek-observability
    app.kubernetes.io/part-of: robotek
    environment: staging

spec:
  project: default

  source:
    repoURL: https://github.com/iheb-mrabet/robotek-1.2.git
    targetRevision: main
    path: deploy/helm/observability

    helm:
      releaseName: robotek-observability
      valueFiles:
        - values-staging.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true

    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
