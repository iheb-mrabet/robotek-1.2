apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: robotek-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/iheb-mrabet/robotek-1.2.git
    targetRevision: main
    path: deploy/helm/robotek-demo
    helm:
      releaseName: robotek-demo
      valueFiles:
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: robotek-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
