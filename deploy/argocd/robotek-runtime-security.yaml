apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: robotek-runtime-security
  namespace: argocd

  labels:
    app.kubernetes.io/name: robotek-runtime-security
    app.kubernetes.io/part-of: robotek
    environment: staging

spec:
  project: default

  source:
    repoURL: https://github.com/iheb-mrabet/robotek-1.2.git
    targetRevision: main
    path: deploy/helm/runtime-security

    helm:
      releaseName: robotek-runtime-security
      valueFiles:
        - values-staging.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: runtime-security

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true

    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
