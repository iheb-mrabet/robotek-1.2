apiVersion: v1
kind: Service
metadata:
  name: robotek-demo-frontend
spec:
  type: NodePort
  selector:
    app: robotek-demo-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: {{ .Values.frontend.nodePort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robotek-demo-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: robotek-demo-frontend
  template:
    metadata:
      labels:
        app: robotek-demo-frontend
        app.kubernetes.io/part-of: robotek-demo
    spec:
      containers:
        - name: frontend
          image: {{ printf "%s:%s" .Values.images.frontend.repository .Values.images.frontend.tag | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.frontend | nindent 12 }}
