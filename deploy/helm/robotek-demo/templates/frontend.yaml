apiVersion: v1
kind: Service
metadata:
  name: robotek-demo-frontend
spec:
  type: NodePort
  selector:
    app: robotek-demo-frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: {{ .Values.frontend.nodePort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robotek-demo-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: robotek-demo-frontend
  template:
    metadata:
      labels:
        app: robotek-demo-frontend
        app.kubernetes.io/part-of: robotek-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: {{ printf "%s:%s" .Values.images.frontend.repository .Values.images.frontend.tag | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.frontend | nindent 12 }}
          volumeMounts:
            - name: frontend-tmp
              mountPath: /tmp
      volumes:
        - name: frontend-tmp
          emptyDir: {}
