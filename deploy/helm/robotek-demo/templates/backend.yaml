apiVersion: v1
kind: Service
metadata:
  name: robotek-demo-backend
spec:
  selector:
    app: robotek-demo-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robotek-demo-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: robotek-demo-backend
  template:
    metadata:
      labels:
        app: robotek-demo-backend
        app.kubernetes.io/part-of: robotek-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: {{ printf "%s:%s" .Values.images.backend.repository .Values.images.backend.tag | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: robotek-demo-database
                  key: DATABASE_URL
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
          volumeMounts:
            - name: backend-tmp
              mountPath: /tmp
      volumes:
        - name: backend-tmp
          emptyDir: {}
