apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: robotek-demo-deployment-reader
  labels:
    app.kubernetes.io/part-of: robotek-demo
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
      - services
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: robotek-demo-github-actions-reader
  labels:
    app.kubernetes.io/part-of: robotek-demo
subjects:
  - kind: ServiceAccount
    name: github-actions-staging
    namespace: robotek-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: robotek-demo-deployment-reader
