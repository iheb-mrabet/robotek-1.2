apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "robotek.fullname" . }}
  labels:
    {{- include "robotek.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  strategy:
    type: {{ .Values.deployment.strategy.type }}

  selector:
    matchLabels:
      {{- include "robotek.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "robotek.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

    spec:
      serviceAccountName: {{ include "robotek.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}

      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: robotek

          image: {{ include "robotek.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          args:
            - ros2
            - launch
            - {{ .Values.robot.launch.package | quote }}
            - {{ .Values.robot.launch.file | quote }}
            {{- range $name, $value := .Values.robot.launch.arguments }}
            - {{ printf "%s:=%s" $name $value | quote }}
            {{- end }}

          env:
            - name: ROS_DOMAIN_ID
              value: {{ .Values.robot.rosDomainId | quote }}

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          {{- if .Values.healthProbes.startup.enabled }}
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -lc
                - |
                  source /opt/ros/${ROS_DISTRO}/setup.bash
                  source /opt/robot/setup.bash

                  timeout 8 ros2 topic echo \
                    /mission/status \
                    mock_robot_interfaces/msg/MissionStatus \
                    --once \
                    --no-daemon \
                    >/dev/null 2>&1 &&

                  timeout 8 ros2 topic echo \
                    /odom \
                    nav_msgs/msg/Odometry \
                    --once \
                    --no-daemon \
                    --qos-reliability best_effort \
                    >/dev/null 2>&1
            periodSeconds: {{ .Values.healthProbes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.healthProbes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.healthProbes.startup.failureThreshold }}
            successThreshold: {{ .Values.healthProbes.startup.successThreshold }}
          {{- end }}

          {{- if .Values.healthProbes.readiness.enabled }}
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -lc
                - |
                  source /opt/ros/${ROS_DISTRO}/setup.bash
                  source /opt/robot/setup.bash

                  timeout 8 ros2 topic echo \
                    /mission/status \
                    mock_robot_interfaces/msg/MissionStatus \
                    --once \
                    --no-daemon \
                    >/dev/null 2>&1 &&

                  timeout 8 ros2 topic echo \
                    /odom \
                    nav_msgs/msg/Odometry \
                    --once \
                    --no-daemon \
                    --qos-reliability best_effort \
                    >/dev/null 2>&1
            periodSeconds: {{ .Values.healthProbes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.healthProbes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.healthProbes.readiness.failureThreshold }}
            successThreshold: {{ .Values.healthProbes.readiness.successThreshold }}
          {{- end }}

          volumeMounts:
            - name: robot-tmp
              mountPath: /tmp

            - name: robot-home
              mountPath: /home/robot

            {{- if .Values.sharedMemory.enabled }}
            - name: shared-memory
              mountPath: /dev/shm
            {{- end }}

        {{- if .Values.observability.enabled }}
        - name: ros-exporter

          image: {{ include "robotek.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          args:
            - ros2
            - run
            - mock_robot_observability
            - ros_exporter

          env:
            - name: ROS_DOMAIN_ID
              value: {{ .Values.robot.rosDomainId | quote }}

            - name: ROBOTEK_METRICS_PORT
              value: {{ .Values.observability.metricsPort | quote }}

          ports:
            - name: metrics
              containerPort: {{ .Values.observability.metricsPort }}
              protocol: TCP

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

          resources:
            {{- toYaml .Values.observability.exporter.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /-/ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /-/ready
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: exporter-tmp
              mountPath: /tmp

            - name: exporter-home
              mountPath: /home/robot
        {{- end }}

      volumes:
        - name: robot-tmp
          emptyDir: {}

        - name: robot-home
          emptyDir: {}

        {{- if .Values.observability.enabled }}
        - name: exporter-tmp
          emptyDir: {}

        - name: exporter-home
          emptyDir: {}
        {{- end }}

        {{- if .Values.sharedMemory.enabled }}
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.sharedMemory.sizeLimit }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}