services:
  database:
    build:
      context: ./database
    image: ihebmrabet/robotek-demo-database:local
    environment:
      POSTGRES_DB: robotek
      POSTGRES_USER: robotek
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robotek -d robotek"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    image: ihebmrabet/robotek-demo-backend:local
    environment:
      DATABASE_URL: postgresql://robotek@database:5432/robotek
      DEPLOYMENT_RELEASE: local
      PROMETHEUS_URL: ""
      GRAFANA_URL: ""
      GRAFANA_PUBLIC_URL: ""
      PROMETHEUS_PUBLIC_URL: ""
    depends_on:
      database:
        condition: service_healthy
    networks:
      default:
        aliases:
          - robotek-demo-backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
    image: ihebmrabet/robotek-demo-frontend:local
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
